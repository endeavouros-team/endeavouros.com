<header class="site-header">
  <div class="container site-header__inner">
    <a class="brand" href="/">{% include "partials/logo.html" %}</a>

    <nav class="nav" aria-label="Main">
      <ul class="nav__list">
        {%- for item in site.nav %}
        <li>
          <a class="nav__link{% if item.cta %} nav__link--cta{% endif %}{% if item.wip %} nav__link--wip{% endif %}"
             href="{{ item.url }}"
             {%- if item.external %} rel="noopener noreferrer"{% endif %}
             {%- if item.wip %} title="Not migrated yet &mdash; opens the current site"{% endif %}
             {%- if not item.external and current_path and current_path == item.url %} aria-current="page"{% endif %}>{{ item.name }}</a>
        </li>
        {%- endfor %}
        <li>
          <button id="theme-toggle" class="theme-toggle" type="button" hidden aria-label="Switch colour theme">
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8">
              <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke-linecap="round"/>
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" stroke-linejoin="round"/>
            </svg>
          </button>
        </li>
      </ul>
    </nav>
  </div>
</header>
