<section class="section section--sunken" id="requirements">
  <div class="container stack">
    <h2>System requirements</h2>
    <div class="grid">
      <div class="card stat"><p class="stat__value">{{ rel.requirements.diskGb }} GB</p><p class="stat__label">free disk space</p></div>
      <div class="card stat"><p class="stat__value">{{ rel.requirements.ramGb }} GB</p><p class="stat__label">RAM</p></div>
      <div class="card stat"><p class="stat__value">64-bit</p><p class="stat__label">{{ rel.requirements.cpu }}</p></div>
    </div>
    <p class="lede">{{ rel.requirements.note }}</p>
  </div>
</section>
