<section class="section section--sunken" id="bootloader">
  <div class="container stack">
    <h2>Choose your bootloader</h2>
    <div class="grid">
      {%- for b in pkgs.bootloaders %}
      <div class="card"><h3>{{ b.name }}</h3><p>{{ b.desc }}</p></div>
      {%- endfor %}
    </div>
    <p class="lede">{{ pkgs.bootloaderNote.text }}</p>
  </div>
</section>
