# Static preview server for the EndeavourOS draft, fronted by the Cloudflare
# Tunnel already running on sra-oracle.
#
# The security headers here are a deliberate restatement of the ones in
# zola/static/_headers and astro/public/_headers. Those files are Cloudflare
# Pages syntax and nginx ignores them, so without this the preview would run
# with no CSP at all and production would be the first place the policy is
# ever exercised.
#
# The Astro track additionally needs four sha256 script hashes; they are
# included here so one config serves both tracks. An unused hash is harmless,
# and keeping the file single avoids the two drifting apart.
#
# astro/scripts/check-build.mjs asserts this list matches the build, so a hash
# that changes here without changing there fails the build rather than silently
# blocking a script on the preview only.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Without this, nginx answers /download with an absolute redirect built from
    # its own listen address, sending the visitor to http://127.0.0.1/download/.
    # Behind a reverse proxy that is a dead link; relative redirects are correct.
    absolute_redirect off;

    # WordPress served four feed endpoints, and /feed/ is advertised in the
    # <head> of every page on the current site -- so any reader that ever
    # visited it auto-discovered that URL. Without these, all four become 404s
    # at cutover, and feed readers fail quietly: subscribers would not complain,
    # they would just stop hearing from the project.
    #
    # Comments are deliberately not coming back, so that one is 410 Gone rather
    # than a redirect to a feed that would never mention them.
    #
    # NOTE: docker-compose.yml mounts ./conf into the eos-zola container too, so
    # on the Zola preview these redirect to a path that does not exist -- that
    # track has no feed, only the /news/ stub. Unlike the unused CSP hashes
    # above, that is worse than harmless. It is accepted because the Astro track
    # is the one becoming production and the Zola track is scheduled for
    # retirement; see issue 8 in docs/status.md.
    location = /feed/          { return 301 /news/feed.xml; }
    location = /news/feed/     { return 301 /news/feed.xml; }
    location = /feed/atom/     { return 301 /news/feed.xml; }
    location = /comments/feed/ { return 410; }

    # The endpoint sets application/rss+xml, but that header only exists at
    # request time; a static build just writes feed.xml to disk and nginx types
    # it from the extension, which maps .xml to text/xml. Most readers cope,
    # WordPress served application/rss+xml, and strict autodiscovery does check.
    location = /news/feed.xml {
        types { }
        default_type "application/rss+xml; charset=utf-8";
    }

    # /download/ must resolve to download/index.html without a redirect loop.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-OPVAgLlUdHteJCCxMInmGWFbAd1S+V3x5ul4l5FPzzA=' 'sha256-PWLFOH+LZXNhRvdviWGKytnaVyCXPhROiHjFnclKwrs=' 'sha256-fGYjnkJteui3LcvhdRqw9PBnM3zOl+LWRv2ZubzSr2k=' 'sha256-xkPAaQvVJomOdU9zp7QJpREzVB1lWyoRUWidAGGD9s4='; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # This is an unlisted internal preview. The pages already carry noindex and
    # robots.txt disallows everything; this is the belt-and-braces third layer.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Short cache: reviewers must see a redeploy immediately, not a stale copy.
    add_header Cache-Control "no-cache" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml;

    access_log off;
}
