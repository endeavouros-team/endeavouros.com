# Production server config for endeavouros.com.
#
# Derived from nginx-preview.conf, which is where every rule below was actually
# exercised before it came here. The two files differ only in what is about
# *being a preview*: this one indexes, caches properly, and keeps access logs.
#
# THREE VALUES TO CONFIRM ON THE BOX before this is loaded, all marked CONFIRM:
# the webroot, the server_name, and the TLS certificate paths. Everything else
# is correct as written and should not be edited casually -- in particular the
# four sha256 hashes in the CSP are cross-checked against the build by
# astro/scripts/check-build.mjs, so editing them here without rebuilding fails
# the build rather than silently blocking a script in production.

# Plain HTTP exists only to send everyone to HTTPS. HSTS below means a browser
# that has been here once will not use this block again.
server {
    listen 80;
    listen [::]:80;
    # CONFIRM: both names, and that DNS for www actually points here.
    server_name endeavouros.com www.endeavouros.com;

    # Certbot writes its challenge files here and must keep working, or renewal
    # silently stops and the certificate expires 90 days later.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    # CONFIRM: server_name, and that the certificate covers both names.
    server_name endeavouros.com www.endeavouros.com;

    # CONFIRM: the webroot rsync targets. This must be a directory that holds
    # ONLY the static build -- see the README on why the rsync uses --delete.
    root /var/www/endeavouros.com;
    index index.html;

    # CONFIRM: certbot's standard paths. If TLS is terminated somewhere else,
    # delete both server blocks' listen/ssl lines and keep the rest.
    ssl_certificate     /etc/letsencrypt/live/endeavouros.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/endeavouros.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Without this, nginx answers /download with an absolute redirect built from
    # its own listen address. Harmless here, wrong behind any proxy, and there
    # is no reason for these redirects to be absolute.
    absolute_redirect off;

    # WordPress served four feed endpoints, and /feed/ was advertised in the
    # <head> of every page on the old site -- so any reader that ever visited it
    # auto-discovered that URL. Without these, all four become 404s at cutover
    # and feed readers fail quietly: subscribers would not complain, they would
    # just stop hearing from the project.
    #
    # Comments are deliberately not coming back, so that one is 410 Gone rather
    # than a redirect to a feed that would never mention them.
    location = /feed/          { return 301 /news/feed.xml; }
    location = /news/feed/     { return 301 /news/feed.xml; }
    location = /feed/atom/     { return 301 /news/feed.xml; }
    location = /comments/feed/ { return 410; }

    # The two WordPress slugs that did not survive the rebuild. Every other page
    # kept its original slug precisely so no redirect would be needed, and these
    # two are redirects because the old URLs are what the forum, the wiki and
    # the search index already point at.
    location = /endeavouros-arm-install/ { return 301 /endeavouros-arm/; }
    location = /privacy-policy-2/        { return 301 /privacy-policy/; }

    # A static build just writes feed.xml to disk, and nginx types it from the
    # extension, which maps .xml to text/xml. WordPress served application/rss+xml
    # and strict autodiscovery does check.
    location = /news/feed.xml {
        types { }
        default_type "application/rss+xml; charset=utf-8";
    }

    # Astro fingerprints every filename under /_astro/, so the content at a given
    # URL can never change and these are safe to cache forever. This is the
    # single biggest difference between this config and the preview, which
    # deliberately caches nothing so reviewers always see a fresh deploy.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # add_header replaces the inherited set within a block, so the security
        # headers have to be restated here or assets are served without them.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-OPVAgLlUdHteJCCxMInmGWFbAd1S+V3x5ul4l5FPzzA=' 'sha256-PWLFOH+LZXNhRvdviWGKytnaVyCXPhROiHjFnclKwrs=' 'sha256-fGYjnkJteui3LcvhdRqw9PBnM3zOl+LWRv2ZubzSr2k=' 'sha256-xkPAaQvVJomOdU9zp7QJpREzVB1lWyoRUWidAGGD9s4='; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Access logs stay ON, unlike the preview.
    #
    # Two reasons, and the first is not optional: /privacy-policy/ tells visitors
    # we keep request logs for no more than 90 days, so logrotate on this host
    # must be set to match that promise -- shorter is fine, longer makes the page
    # untrue. The second is that logs are how the next compromise gets diagnosed;
    # the August hijacks were noticed by users rather than by us.
    access_log /var/log/nginx/endeavouros.com.access.log;
    error_log  /var/log/nginx/endeavouros.com.error.log;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml application/rss+xml;

    # No PHP handler, no admin path, nothing writable. If a location block for
    # any of those ever appears in this file, something has gone wrong: the whole
    # premise of the rebuild is that there is no interpreter to reach.
}
