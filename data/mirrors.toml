# Download mirrors for EndeavourOS.
#
# The three URLs shown for each mirror are COMPOSED, never stored:
#
#     {base}/{release.iso}
#     {base}/{release.iso}{sha512Suffix}
#     {base}/{release.iso}{sigSuffix}
#
# so publishing a new ISO touches release.toml only and every mirror URL on the
# site regenerates. Adding a mirror means appending one stanza here.
#
# `base` is the directory holding the ISO, https, with NO trailing slash.
# Set `active = false` to hide a mirror without deleting its record.

# ---------- Africa ----------

[[mirrors]]
id          = "urban-wave-za"
continent   = "Africa"
country     = "South Africa"
countryCode = "ZA"
name        = "Urban Wave"
base        = "https://mirrors.urbanwave.co.za/endeavouros/iso"

