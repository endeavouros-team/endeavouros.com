# Site chrome: identity, navigation and footer. Read by both tracks so the two
# builds cannot disagree about what the site is called or where it links.

name        = "EndeavourOS"
tagline     = "Start your Endeavour"
subtitle    = "with a lightweight Arch-based, terminal-centric system ready to personalise and a stellar community at your side"
description = "A terminal-centric Arch-based Linux distribution with a vibrant and friendly community at its core."
url         = "https://endeavouros.com"

# Origins that imported post bodies are permitted to link out to.
#
# The build-output gates derive their allowlist from this directory alone. That
# is deliberate: deriving it from the content instead would let an injected link
# authorise itself, which is the exact failure the gates exist to catch. So a
# new outbound host in a news post is a hand edit here, reviewed like any other.
contentOrigins = [
  "https://github.com",
  "https://archlinux.org",
]

# Primary navigation.
#
# `external = true` points at the current site for sections that are not rebuilt
# yet, so the full navigation is visible and every link goes somewhere real.
# `wip = true` renders them muted. Clear both as each section lands.

[[nav]]
name = "Home"
url  = "/"

[[nav]]
name = "News"
url  = "/news/"

[[nav]]
name     = "EndeavourOS ARM"
url      = "https://endeavouros.com/endeavouros-arm/"
external = true
wip      = true

[[nav]]
name     = "Help"
url      = "https://discovery.endeavouros.com/"
external = true

[[nav]]
name     = "Community"
url      = "https://forum.endeavouros.com/"
external = true

[[nav]]
name     = "Info"
